name: Update schedule data

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse official schedule
        id: parse
        continue-on-error: true
        run: python scripts/parse_gymnasium23.py --out data

      - name: Commit updated schedule
        if: steps.parse.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json data/schedule.js
          if git diff --cached --quiet; then
            echo "Schedule data is already up to date."
          else
            git commit -m "Update schedule data"
            git push
          fi

      - name: Keep previous schedule if official site is unavailable
        if: steps.parse.outcome != 'success'
        run: |
          echo "Official website was unavailable from GitHub Actions."
          echo "The site keeps the last published schedule."
          echo "Run the local BAT file to update and publish from this computer."
